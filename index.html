<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101214">
  <meta name="description" content="PRIME ERA — персональная система физического и социального развития">
  <link rel="manifest" href="./manifest.json">
  <title>PRIME ERA</title>
  <style>
    :root{color-scheme:dark;--bg:#101214;--panel:#191d20;--panel2:#202529;--line:#30373b;--text:#f2f5f4;--muted:#9aa5a8;--mint:#55e6cf;--orange:#ff8b45;--accent:var(--mint);--accent-soft:#172724;--danger:#ff6b6b;--radius:18px}
    *{box-sizing:border-box}html{background:var(--bg);scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;padding-bottom:calc(26px + env(safe-area-inset-bottom))}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    .app{max-width:760px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px 24px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}.brand{font-size:20px;font-weight:900;letter-spacing:2px}.brand span{color:var(--accent)}.top-actions{display:flex;gap:8px}.icon-btn{width:42px;height:42px;border:1px solid var(--line);background:var(--panel);border-radius:13px;color:var(--text);font-size:18px;display:grid;place-items:center}.eyebrow{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:1.7px;text-transform:uppercase}.page-title{font-size:29px;line-height:1.08;margin:6px 0 8px;font-weight:850;letter-spacing:-.7px}.sub{color:var(--muted);font-size:14px;line-height:1.5;margin:0 0 20px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 12px}.section-head h2{font-size:17px;margin:0}.small{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0}.card h3{font-size:15px;margin:0 0 8px}.card p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}.metric{font-size:28px;font-weight:850;letter-spacing:-.6px;margin:5px 0}.metric small{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:0}.accent-card{background:linear-gradient(145deg,var(--accent-soft),var(--panel));border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:13px;padding:12px 14px;font-weight:750;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px}.btn.primary{background:var(--accent);color:#101414;border-color:var(--accent)}.btn.ghost{background:transparent}.btn.danger{color:var(--danger);border-color:#633c40;background:#25191b}.btn.small-btn{padding:8px 10px;min-height:36px;font-size:12px}.btn.full{width:100%}.btn-row{display:flex;gap:8px;flex-wrap:wrap}.hero-choice{border:1px solid var(--line);border-radius:24px;padding:22px;min-height:205px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:20px;background:var(--panel);color:var(--text)}.hero-choice.body{border-color:var(--mint);background:linear-gradient(145deg,#172724,#121719)}.hero-choice.social{border-color:var(--orange);background:linear-gradient(145deg,#2b211a,#171515)}.hero-choice .choice-name{font-size:30px;font-weight:900;letter-spacing:1px}.hero-choice.body .choice-name,.body-mode .eyebrow,.body-mode .section-accent{color:var(--mint)}.hero-choice.social .choice-name,.social-mode .eyebrow,.social-mode .section-accent{color:var(--orange)}.choice-desc{font-size:13px;color:#c0c8c7;line-height:1.5}.choice-icon{font-size:32px;display:none}.hero-choice.social .eyebrow{color:var(--orange)}#approach-date{width:calc(100% - 8px);max-width:100%;min-width:0;margin-left:-4px}.body-mode{--accent:var(--mint);--accent-soft:#172724}.social-mode{--accent:var(--orange);--accent-soft:#2b211a}.tabs{display:flex;gap:7px;overflow:auto;padding:2px 0 10px;margin:0 0 18px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:12px;padding:10px 13px;font-size:13px;font-weight:750}.tab.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}.field{display:flex;flex-direction:column;gap:7px;margin:12px 0}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#111416;color:var(--text);border-radius:12px;padding:12px;min-height:45px}.field textarea{min-height:92px;resize:vertical}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.form-grid .field{margin:6px 0}.list{display:flex;flex-direction:column;gap:10px}.item{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px}.item-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.item-title{font-weight:800;font-size:14px}.item-meta{color:var(--muted);font-size:12px;line-height:1.5;margin-top:5px}.pill{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:5px 8px;font-size:11px;color:var(--muted);white-space:nowrap}.pill.accent{color:var(--accent);border-color:var(--accent)}.empty{border:1px dashed var(--line);border-radius:16px;padding:22px;text-align:center;color:var(--muted);font-size:13px;line-height:1.5}.divider{height:1px;background:var(--line);margin:14px 0}.chart{display:flex;align-items:flex-end;gap:7px;height:145px;padding:12px 2px 0;border-bottom:1px solid var(--line);overflow:hidden}.bar-col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}.bar{width:min(28px,80%);min-height:3px;border-radius:7px 7px 2px 2px;background:var(--accent);opacity:.9}.bar-value{font-size:10px;color:var(--muted)}.bar-label{font-size:10px;color:var(--muted);white-space:nowrap}.progress{height:8px;background:#343b3f;border-radius:99px;overflow:hidden;margin:10px 0}.progress span{display:block;height:100%;background:var(--accent);border-radius:99px}.range-row{display:flex;align-items:center;gap:12px}.range-row input{flex:1;accent-color:var(--accent)}.range-number{font-weight:850;color:var(--accent);min-width:34px;text-align:right}.muted-note{font-size:12px;color:var(--muted);line-height:1.5}.footer-note{text-align:center;color:#697377;font-size:11px;margin:28px 0 8px}.hidden{display:none!important}.exercise-block{border:1px solid var(--line);border-radius:14px;padding:12px;margin:12px 0;background:#15191b}.set-row{display:grid;grid-template-columns:32px 1fr 1fr 34px;gap:7px;align-items:center;margin-top:7px}.set-row input{width:100%;min-width:0;border:1px solid var(--line);background:#101315;color:var(--text);border-radius:9px;padding:9px 6px;text-align:center}.set-label{font-size:12px;color:var(--muted);text-align:center}.nav-footer{display:flex;justify-content:center;margin-top:18px}.notice{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));border-radius:14px;padding:12px;font-size:12px;line-height:1.5;color:var(--text);margin:12px 0}.toast{position:fixed;left:16px;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));max-width:500px;margin:auto;background:#f0f4f3;color:#121617;border-radius:13px;padding:13px 16px;font-size:13px;font-weight:750;box-shadow:0 8px 30px #0008;z-index:20}.result-interest{color:#55e6cf}.result-contact{color:#83d9a8}.result-pleasant{color:#ffbd72}.result-neutral{color:#b4bdc0}.result-reject{color:#ff7777}
    @media(min-width:600px){.app{padding-left:24px;padding-right:24px}.hero-choice{min-height:235px;padding:25px}.page-title{font-size:34px}}
    @media(max-width:390px){.grid{gap:8px}.card{padding:13px}.hero-choice{padding:16px;min-height:185px}.hero-choice .choice-name{font-size:26px}.form-grid{gap:7px}}
  </style>
</head>
<body>
  <div id="app" class="app"></div>
  <div id="toast" class="toast hidden" role="status"></div>
  <script>
  (() => {
    "use strict";
    const STORE_KEY = "primeEraV2Data";
    const $ = (s, root=document) => root.querySelector(s);
    const $$ = (s, root=document) => [...root.querySelectorAll(s)];
    const today = () => new Date().toISOString().slice(0,10);
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
    const fmtDate = (d) => { if(!d) return "Без даты"; const p=d.split("-"); return p.length===3 ? `${p[2]}.${p[1]}.${p[0]}` : d; };
    const esc = (s="") => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const defaults = () => ({
      version:2, settings:{dailyGoal:3},
      workouts:[], templates:[],
      bodyEntries:[], sleepEntries:[],
      approaches:[], openers:[]
    });
    let data = loadData();
    let mode = "chooser";
    let bodyTab = "home";
    let socialTab = "home";
    let gymDraft = null;
    let gymDraftType = "new";
    let editingApproachId = null;
    let editingBodyId = null;
    let editingSleepId = null;
    let editingOpenerId = null;
    let toastTimer = null;

    function loadData(){
      try {
        const raw=localStorage.getItem(STORE_KEY);
        if(!raw) return defaults();
        const parsed=JSON.parse(raw);
        return {...defaults(),...parsed,settings:{...defaults().settings,...(parsed.settings||{})}};
      } catch(e){ return defaults(); }
    }
    function saveData(){ try { localStorage.setItem(STORE_KEY,JSON.stringify(data)); } catch(e){ notify("Не удалось сохранить данные. Экспортируй резервную копию."); } }
    function notify(message){
      const el=$("#toast"); el.textContent=message; el.classList.remove("hidden");
      clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.add("hidden"),2600);
    }
    function setMode(next){ mode=next; render(); window.scrollTo({top:0,behavior:"smooth"}); }
    function setBodyTab(next){ bodyTab=next; render(); }
    function setSocialTab(next){ socialTab=next; render(); }
    function heading(eyebrow,title,sub=""){return `<div class="eyebrow">${eyebrow}</div><h1 class="page-title">${title}</h1>${sub?`<p class="sub">${sub}</p>`:""}`;}
    function cardMetric(label,value,unit="",extra=""){return `<div class="card"><p>${label}</p><div class="metric">${value}<small>${unit?` ${unit}`:""}</small></div>${extra?`<p>${extra}</p>`:""}</div>`;}
    function tabs(items,current,onClickName){return `<div class="tabs">${items.map(([id,label])=>`<button class="tab ${id===current?"active":""}" data-action="${onClickName}" data-tab="${id}">${label}</button>`).join("")}</div>`;}
    function dateInput(value=today(),id="date"){return `<input id="${id}" type="date" value="${esc(value||today())}">`;}
    function safeNum(v){const n=Number(v);return Number.isFinite(n)?n:0;}
    function sumWorkoutSets(w){return (w.exercises||[]).reduce((a,e)=>a+(e.sets||[]).length,0);}
    function totalVolume(w){return (w.exercises||[]).reduce((sum,e)=>sum+(e.sets||[]).reduce((s,set)=>s+safeNum(set.weight)*safeNum(set.reps),0),0);}
    function latest(arr){return [...arr].sort((a,b)=>(b.date||"").localeCompare(a.date||""))[0];}
    function chartHTML(entries,valueKey,{color="",unit="",empty="Пока недостаточно данных",format=null}={}){
      const rows=[...entries].sort((a,b)=>(a.date||"").localeCompare(b.date||"")).slice(-7);
      if(!rows.length) return `<div class="empty">${empty}</div>`;
      const vals=rows.map(x=>safeNum(x[valueKey])); const max=Math.max(...vals,1);
      return `<div class="chart">${rows.map((r,i)=>{const v=vals[i];const h=Math.max(4,Math.round(v/max*100));return `<div class="bar-col"><div class="bar-value">${format?format(v):v}${unit}</div><div class="bar" style="height:${h}%;${color?`background:${color};`:""}"></div><div class="bar-label">${esc((r.date||"").slice(5).replace("-","/"))}</div></div>`;}).join("")}</div>`;
    }
    function goalSummary(){
      const count=data.approaches.filter(a=>a.date===today()).length;
      const goal=Math.max(1,safeNum(data.settings.dailyGoal)||3);
      return {count,goal,percent:Math.min(100,Math.round(count/goal*100))};
    }
    function render(){
      const root=$("#app");
      root.className="app"+(mode==="body"?" body-mode":mode==="social"?" social-mode":"");
      if(mode==="chooser") root.innerHTML=renderChooser();
      else if(mode==="settings") root.innerHTML=renderSettings();
      else if(mode==="body") root.innerHTML=renderBody();
      else if(mode==="social") root.innerHTML=renderSocial();
      bindEvents();
    }
    function topbar(back=true){
      return `<header class="topbar"><div class="brand">PRIME <span>ERA</span></div><div class="top-actions">${back?`<button class="icon-btn" data-action="chooser" aria-label="Выбор направления">⌂</button>`:""}<button class="icon-btn" data-action="settings" aria-label="Настройки">⚙</button></div></header>`;
    }
    function renderChooser(){
      return `${topbar(false)}<div class="eyebrow">YOUR PERSONAL DEVELOPMENT SYSTEM</div><h1 class="page-title" style="font-size:34px;margin-top:10px">Выбери направление.</h1><p class="sub">Два направления. Один ты. Никаких волшебных кнопок, только системная работа.</p>
      <div class="grid">
        <button class="hero-choice body" data-action="body"><div class="choice-icon">✳</div><div><div class="choice-name">BODY</div><div class="choice-desc">Тренировки, параметры тела, сон и физический прогресс.</div></div><div class="eyebrow">Войти в раздел ↗</div></button>
        <button class="hero-choice social" data-action="social"><div class="choice-icon">↗</div><div><div class="choice-name">SOCIAL</div><div class="choice-desc">Подходы, волнение, опенеры и развитие социальной смелости.</div></div><div class="eyebrow">Войти в раздел ↗</div></button>
      </div>
      <div class="section-head"><h2>Твоя система</h2><span class="small">PRIME ERA 2.0</span></div>
      <div class="grid">${cardMetric("Тренировок",data.workouts.length,"")}${cardMetric("Подходов сегодня",goalSummary().count,"")}</div>
      <div class="footer-note">Данные хранятся на этом устройстве. Делай резервные копии.</div>`;
    }
    function renderBody(){
      const tabsHTML=tabs([["home","Сводка"],["gym","Зал"],["body","Тело"],["sleep","Режим"]],bodyTab,"body-tab");
      let content="";
      if(bodyTab==="home"){
        const last=latest(data.workouts), body=latest(data.bodyEntries), sleep=latest(data.sleepEntries);
        const totalSets=data.workouts.reduce((n,w)=>n+sumWorkoutSets(w),0);
        content=`${heading("BODY / OVERVIEW","Физический прогресс","Твои тренировки, параметры и восстановление в одном месте.")}
        <div class="grid">${cardMetric("Тренировок",data.workouts.length,"")}${cardMetric("Подходов в зале",totalSets,"")}${cardMetric("Текущий вес",body?safeNum(body.weight).toLocaleString("ru-RU"):"—",body&&body.weight?"кг":"")}${cardMetric("Последний сон",sleep?safeNum(sleep.hours).toLocaleString("ru-RU"):"—",sleep?"ч":"")}</div>
        <div class="section-head"><h2>Последняя тренировка</h2><button class="btn small-btn" data-action="body-tab" data-tab="gym">Открыть зал</button></div>
        ${last?`<div class="card"><div class="item-top"><div><h3>${esc(last.name||"Тренировка")}</h3><p>${fmtDate(last.date)} · ${(last.exercises||[]).length} упражнений · ${sumWorkoutSets(last)} подходов</p></div><span class="pill accent">${Math.round(totalVolume(last)).toLocaleString("ru-RU")} кг·повт.</span></div></div>`:`<div class="empty">Тренировок пока нет. Первая запись начнёт историю.</div>`}
        <div class="section-head"><h2>Динамика веса</h2><button class="btn small-btn" data-action="body-tab" data-tab="body">Параметры</button></div>${chartHTML(data.bodyEntries,"weight",{unit:" кг",empty:"Добавь первое измерение тела."})}
        <div class="section-head"><h2>Сон</h2><button class="btn small-btn" data-action="body-tab" data-tab="sleep">Записать</button></div>${chartHTML(data.sleepEntries,"hours",{unit:" ч",empty:"Добавь запись сна."})}`;
      } else if(bodyTab==="gym"){
        content=`${heading("BODY / TRAINING","Зал","Создавай тренировку с нуля или используй сохранённый шаблон.")}
        <div class="btn-row"><button class="btn primary" data-action="gym-new">＋ Новая тренировка</button><button class="btn" data-action="template-new">＋ Шаблон</button></div>
        ${data.templates.length?`<div class="section-head"><h2>Мои шаблоны</h2></div><div class="list">${data.templates.map(t=>`<div class="item"><div class="item-top"><div><div class="item-title">${esc(t.name)}</div><div class="item-meta">${(t.exercises||[]).length} упражнений</div></div><button class="btn small-btn primary" data-action="template-start" data-id="${t.id}">Начать</button></div><div class="btn-row" style="margin-top:9px"><button class="btn small-btn" data-action="template-delete" data-id="${t.id}">Удалить</button></div></div>`).join("")}</div>`:""}
        <div class="section-head"><h2>История тренировок</h2></div>
        ${data.workouts.length?`<div class="list">${[...data.workouts].sort((a,b)=>b.date.localeCompare(a.date)).map(w=>`<div class="item"><div class="item-top"><div><div class="item-title">${esc(w.name||"Тренировка")}</div><div class="item-meta">${fmtDate(w.date)} · ${(w.exercises||[]).length} упражн. · ${sumWorkoutSets(w)} подходов</div></div><span class="pill">${Math.round(totalVolume(w)).toLocaleString("ru-RU")} кг·повт.</span></div><div class="btn-row" style="margin-top:10px"><button class="btn small-btn" data-action="workout-view" data-id="${w.id}">Подробнее</button><button class="btn small-btn" data-action="workout-delete" data-id="${w.id}">Удалить</button></div></div>`).join("")}</div>`:`<div class="empty" style="margin-top:14px">Здесь появятся завершённые тренировки.</div>`}
        <div id="gym-editor"></div>`;
      } else if(bodyTab==="body"){
        const current=latest(data.bodyEntries);
        content=`${heading("BODY / MEASUREMENTS","Тело","Записывай параметры с датами и смотри, как они меняются.")}
        <div class="card"><h3>${editingBodyId?"Редактировать измерение":"Новое измерение"}</h3>
          <div class="field"><label>Дата</label>${dateInput(editingBodyId?(data.bodyEntries.find(x=>x.id===editingBodyId)||{}).date:today(),"body-date")}</div>
          <div class="form-grid"><div class="field"><label>Вес, кг</label><input id="body-weight" type="number" min="0" step="0.1" placeholder="74.5" value="${editingBodyId?esc((data.bodyEntries.find(x=>x.id===editingBodyId)||{}).weight??""):""}"></div>
          <div class="field"><label>Талия, см</label><input id="body-waist" type="number" min="0" step="0.1" placeholder="82" value="${editingBodyId?esc((data.bodyEntries.find(x=>x.id===editingBodyId)||{}).waist??""):""}"></div>
          <div class="field"><label>Грудь, см</label><input id="body-chest" type="number" min="0" step="0.1" placeholder="98" value="${editingBodyId?esc((data.bodyEntries.find(x=>x.id===editingBodyId)||{}).chest??""):""}"></div>
          <div class="field"><label>Рука, см</label><input id="body-arm" type="number" min="0" step="0.1" placeholder="34" value="${editingBodyId?esc((data.bodyEntries.find(x=>x.id===editingBodyId)||{}).arm??""):""}"></div></div>
          <div class="field"><label>Заметка (необязательно)</label><input id="body-note" placeholder="Например, утром натощак" value="${editingBodyId?esc((data.bodyEntries.find(x=>x.id===editingBodyId)||{}).note||""):""}"></div>
          <div class="btn-row"><button class="btn primary" data-action="body-save">${editingBodyId?"Сохранить изменения":"Сохранить измерение"}</button>${editingBodyId?`<button class="btn" data-action="body-cancel-edit">Отмена</button>`:""}</div>
        </div>
        <div class="section-head"><h2>Вес</h2></div>${chartHTML(data.bodyEntries,"weight",{unit:" кг",empty:"Нет записей веса."})}
        <div class="section-head"><h2>Талия</h2></div>${chartHTML(data.bodyEntries,"waist",{unit:" см",empty:"Нет записей талии."})}
        <div class="section-head"><h2>История измерений</h2></div>
        ${data.bodyEntries.length?`<div class="list">${[...data.bodyEntries].sort((a,b)=>b.date.localeCompare(a.date)).map(e=>`<div class="item"><div class="item-top"><div><div class="item-title">${fmtDate(e.date)}</div><div class="item-meta">${e.weight!==""&&e.weight!=null?`Вес ${esc(e.weight)} кг · `:""}${e.waist!==""&&e.waist!=null?`Талия ${esc(e.waist)} см · `:""}${e.chest!==""&&e.chest!=null?`Грудь ${esc(e.chest)} см · `:""}${e.arm!==""&&e.arm!=null?`Рука ${esc(e.arm)} см`:""}</div>${e.note?`<div class="item-meta">${esc(e.note)}</div>`:""}</div><span class="pill">Запись</span></div><div class="btn-row" style="margin-top:9px"><button class="btn small-btn" data-action="body-edit" data-id="${e.id}">Изменить</button><button class="btn small-btn" data-action="body-delete" data-id="${e.id}">Удалить</button></div></div>`).join("")}</div>`:`<div class="empty">Пока нет измерений.</div>`}`;
      } else if(bodyTab==="sleep"){
        const entry=editingSleepId?data.sleepEntries.find(x=>x.id===editingSleepId):null;
        content=`${heading("BODY / RECOVERY","Режим","Записывай сон и самочувствие после пробуждения. Без оценок, только наблюдения.")}

        <div class="section-head"><h2>Волнение по последним записям</h2></div>

    function resultLabel(key){return ({interest:"Взаимный интерес",contact:"Обмен контактами",pleasant:"Приятный разговор",neutral:"Нейтральный",reject:"Отказ"})[key]||"Не указан";}
    function resultClass(key){return "result-"+(key||"neutral");}
    function resultColor(key){return ({interest:"#55e6cf",contact:"#83d9a8",pleasant:"#ffbd72",neutral:"#9ba6aa",reject:"#ff7777"})[key]||"#9ba6aa";}
    function lastSevenApproachDays(){
      const rows=[];const now=new Date();
      for(let i=6;i>=0;i--){const d=new Date(now);d.setDate(now.getDate()-i);const key=d.toISOString().slice(0,10);rows.push({date:key,count:data.approaches.filter(a=>a.date===key).length});}
      return rows;
    }
    function renderSettings(){
      return `${topbar()}${heading("PRIME ERA / SETTINGS","Настройки","Цели, резервные копии и управление твоими данными.")}
      <div class="card"><h3>Цель SOCIAL</h3><p>Количество подходов в день. Недельный ориентир рассчитывается автоматически: цель × 7.</p><div class="field"><label>Подходов в день</label><input id="daily-goal" type="number" min="1" max="100" step="1" value="${esc(data.settings.dailyGoal)}"></div><button class="btn primary" data-action="goal-save">Сохранить цель</button><div class="notice">Текущий ориентир: ${data.settings.dailyGoal} в день и ${data.settings.dailyGoal*7} в неделю.</div></div>
      <div class="section-head"><h2>Резервная копия</h2></div><div class="card"><h3>Экспорт данных</h3><p>Сохранит тренировки, шаблоны, параметры тела, сон, подходы, опенеры и настройки в JSON-файл.</p><button class="btn primary full" data-action="backup-export" style="margin-top:13px">↓ Экспортировать резервную копию</button><div class="divider"></div><h3>Восстановление</h3><p>Импорт заменит текущие данные содержимым выбранной резервной копии. Сначала экспортируй текущую версию, если в ней есть что-то важное.</p><input id="backup-file" type="file" accept=".json,application/json" class="hidden"><button class="btn full" data-action="backup-import" style="margin-top:13px">↑ Выбрать файл для восстановления</button></div>
      <div class="section-head"><h2>Управление данными</h2></div><div class="card"><h3>Очистить все данные</h3><p>Удалит все записи и настройки PRIME ERA с этого браузера. Это действие нельзя отменить.</p><button class="btn danger full" data-action="data-clear" style="margin-top:13px">Удалить все данные</button></div>
      <div class="notice">Хранилище локальное. Если очистить данные Safari или удалить сайт, записи могут исчезнуть. Храни резервную копию в приложении «Файлы» или другом безопасном месте.</div>
      <div class="footer-note">PRIME ERA 2.0 · локальное хранение · без аккаунта</div>`;
    }
    function beginWorkout(template=null){
      gymDraft=template?{id:uid(),name:template.name,date:today(),exercises:(template.exercises||[]).map(e=>({id:uid(),name:e.name,sets:(e.sets||[{reps:"",weight:""}]).map(s=>({reps:s.reps??"",weight:s.weight??""}))}))}:{id:uid(),name:"",date:today(),exercises:[]};
      gymDraftType="new"; render(); const editor=$("#gym-editor"); if(editor){editor.innerHTML=workoutEditorHTML(); editor.scrollIntoView({behavior:"smooth",block:"start"});}
      bindEvents();
    }
    function workoutEditorHTML(){
      if(!gymDraft) return "";
      return `<div class="section-head"><h2>${gymDraftType==="template"?"Новый шаблон":"Текущая тренировка"}</h2></div><div class="card" id="workout-editor-card">
      <div class="field"><label>Название тренировки</label><input id="workout-name" maxlength="80" placeholder="Например, Full Body A" value="${esc(gymDraft.name)}"></div>
      <div class="field"><label>Дата</label>${dateInput(gymDraft.date,"workout-date")}</div>
      <div class="field"><label>Название упражнения</label><div class="btn-row"><input id="exercise-name" style="flex:1;min-width:130px;border:1px solid var(--line);background:#111416;color:var(--text);border-radius:12px;padding:12px" placeholder="Например, жим в тренажёре"><button class="btn" data-action="exercise-add">Добавить</button></div></div>
      <div id="exercise-list">${gymDraft.exercises.map((e,ei)=>exerciseHTML(e,ei)).join("")||`<div class="empty">Добавь первое упражнение выше.</div>`}</div>
      <div class="btn-row" style="margin-top:14px"><button class="btn primary" data-action="workout-save">${gymDraftType==="template"?"Сохранить шаблон":"Завершить и сохранить"}</button><button class="btn" data-action="workout-cancel">Отмена</button></div></div>`;
    }
    function exerciseHTML(e,ei){
      return `<div class="exercise-block" data-exercise="${e.id}"><div class="item-top"><div class="item-title">${ei+1}. ${esc(e.name)}</div><button class="btn small-btn" data-action="exercise-delete" data-id="${e.id}">Убрать</button></div><div class="set-row"><span class="set-label">№</span><span class="set-label">Повторы</span><span class="set-label">Вес, кг</span><span></span></div>${e.sets.map((s,si)=>`<div class="set-row" data-set="${si}"><span class="set-label">${si+1}</span><input type="number" min="0" step="1" placeholder="10" aria-label="Повторения" data-reps="${e.id}" data-index="${si}" value="${esc(s.reps)}"><input type="number" min="0" step="0.5" placeholder="20" aria-label="Вес" data-weight="${e.id}" data-index="${si}" value="${esc(s.weight)}"><button class="icon-btn" style="width:32px;height:34px;border-radius:9px" data-action="set-delete" data-exercise="${e.id}" data-index="${si}" aria-label="Удалить подход">×</button></div>`).join("")}<button class="btn small-btn" style="margin-top:9px" data-action="set-add" data-id="${e.id}">＋ Подход</button></div>`;
    }
    function bindEvents(){
      $$("[data-action]").forEach(el=>el.addEventListener("click",handleAction));
      const anxiety=$("#approach-anxiety"); if(anxiety) anxiety.addEventListener("input",()=>$("#anxiety-value").textContent=anxiety.value+"/10");
      if(gymDraft){
        const name=$("#workout-name");if(name)name.addEventListener("input",()=>gymDraft.name=name.value);
        const date=$("#workout-date");if(date)date.addEventListener("change",()=>gymDraft.date=date.value);
        $$("[data-reps]").forEach(input=>input.addEventListener("input",()=>{const e=gymDraft.exercises.find(x=>x.id===input.dataset.reps);if(e&&e.sets[input.dataset.index])e.sets[input.dataset.index].reps=input.value;}));
        $$("[data-weight]").forEach(input=>input.addEventListener("input",()=>{const e=gymDraft.exercises.find(x=>x.id===input.dataset.weight);if(e&&e.sets[input.dataset.index])e.sets[input.dataset.index].weight=input.value;}));
      }
    }
    function handleAction(event){
      const el=event.currentTarget,action=el.dataset.action,id=el.dataset.id,tab=el.dataset.tab;
      if(action==="body"){mode="body";bodyTab="home";render();}
      else if(action==="social"){mode="social";socialTab="home";render();}
      else if(action==="chooser"){mode="chooser";render();}
      else if(action==="settings"){mode="settings";render();}
      else if(action==="body-tab"){bodyTab=tab;editingBodyId=null;editingSleepId=null;gymDraft=null;render();}
      else if(action==="social-tab"){socialTab=tab;editingApproachId=null;editingOpenerId=null;render();}
      else if(action==="gym-new"){beginWorkout();}
      else if(action==="template-new"){gymDraft={id:uid(),name:"",date:today(),exercises:[]};gymDraftType="template";render();$("#gym-editor").innerHTML=workoutEditorHTML();$("#gym-editor").scrollIntoView({behavior:"smooth"});bindEvents();}
      else if(action==="template-start"){const t=data.templates.find(x=>x.id===id);if(t)beginWorkout(t);}
      else if(action==="exercise-add"){const input=$("#exercise-name");const name=(input?.value||"").trim();if(!name){notify("Введи название упражнения.");return;}gymDraft.exercises.push({id:uid(),name,sets:[{reps:"",weight:""}]});$("#gym-editor").innerHTML=workoutEditorHTML();bindEvents();}
      else if(action==="exercise-delete"){gymDraft.exercises=gymDraft.exercises.filter(e=>e.id!==id);$("#gym-editor").innerHTML=workoutEditorHTML();bindEvents();}
      else if(action==="set-add"){const e=gymDraft.exercises.find(x=>x.id===id);if(e)e.sets.push({reps:"",weight:""});$("#gym-editor").innerHTML=workoutEditorHTML();bindEvents();}
      else if(action==="set-delete"){const e=gymDraft.exercises.find(x=>x.id===el.dataset.exercise);if(e&&e.sets.length>1)e.sets.splice(Number(el.dataset.index),1);else if(e)notify("У упражнения должен остаться хотя бы один подход.");$("#gym-editor").innerHTML=workoutEditorHTML();bindEvents();}
      else if(action==="workout-cancel"){gymDraft=null;render();}
      else if(action==="workout-save"){saveWorkout();}
      else if(action==="template-delete"){if(confirm("Удалить этот шаблон?")){data.templates=data.templates.filter(t=>t.id!==id);saveData();render();}}
      else if(action==="workout-delete"){if(confirm("Удалить тренировку из истории?")){data.workouts=data.workouts.filter(w=>w.id!==id);saveData();render();}}
      else if(action==="workout-view"){const w=data.workouts.find(w=>w.id===id);if(w){alert(`${w.name}\n${fmtDate(w.date)}\n\n${w.exercises.map(e=>e.name+"\n"+e.sets.map((s,i)=>`${i+1}. ${s.reps||"—"} повт. × ${s.weight||"—"} кг`).join("\n")).join("\n\n")}`);}}
      else if(action==="body-save"){saveBodyEntry();}
      else if(action==="body-edit"){editingBodyId=id;render();}
      else if(action==="body-cancel-edit"){editingBodyId=null;render();}
      else if(action==="body-delete"){if(confirm("Удалить это измерение?")){data.bodyEntries=data.bodyEntries.filter(x=>x.id!==id);saveData();render();}}
      else if(action==="sleep-save"){saveSleepEntry();}
      else if(action==="sleep-edit"){editingSleepId=id;render();}
      else if(action==="sleep-cancel"){editingSleepId=null;render();}
      else if(action==="sleep-delete"){if(confirm("Удалить запись сна?")){data.sleepEntries=data.sleepEntries.filter(x=>x.id!==id);saveData();render();}}
      else if(action==="approach-save"){saveApproach();}
      else if(action==="approach-edit"){editingApproachId=id;render();}
      else if(action==="approach-cancel"){editingApproachId=null;render();}
      else if(action==="approach-delete"){if(confirm("Удалить эту запись подхода?")){data.approaches=data.approaches.filter(a=>a.id!==id);saveData();render();}}
      else if(action==="approach-new"){socialTab="approaches";editingApproachId=null;render();$("#approach-name")?.focus();}
      else if(action==="opener-save"){saveOpener();}
      else if(action==="opener-edit"){editingOpenerId=id;render();}
      else if(action==="opener-cancel"){editingOpenerId=null;render();}
      else if(action==="opener-delete"){if(confirm("Удалить эту фразу?")){data.openers=data.openers.filter(o=>o.id!==id);saveData();render();}}
      else if(action==="opener-copy"){const o=data.openers.find(o=>o.id===id);if(o){if(navigator.clipboard?.writeText){navigator.clipboard.writeText(o.text).then(()=>notify("Фраза скопирована.")).catch(()=>fallbackCopy(o.text));}else fallbackCopy(o.text);}}
      else if(action==="goal-save"){const v=Math.floor(safeNum($("#daily-goal")?.value));if(v<1||v>100){notify("Цель должна быть от 1 до 100.");return;}data.settings.dailyGoal=v;saveData();render();notify("Цель сохранена.");}
      else if(action==="backup-export"){exportBackup();}
      else if(action==="backup-import"){$("#backup-file").click();}
      else if(action==="data-clear"){if(confirm("Точно удалить ВСЕ данные PRIME ERA с этого устройства? Сначала лучше сделать резервную копию.")){if(confirm("Последнее подтверждение: данные будут удалены без возможности восстановления без копии.")){data=defaults();saveData();mode="chooser";bodyTab="home";socialTab="home";render();notify("Данные удалены.");}}}
    }
    function saveWorkout(){
      if(!gymDraft){return;}gymDraft.name=($("#workout-name")?.value||gymDraft.name||"").trim()||"Тренировка";gymDraft.date=$("#workout-date")?.value||today();
      if(!gymDraft.exercises.length){notify("Добавь хотя бы одно упражнение.");return;}
      gymDraft.exercises.forEach(e=>e.sets=e.sets.map(s=>({reps:s.reps===""?"":safeNum(s.reps),weight:s.weight===""?"":safeNum(s.weight)})));
      if(gymDraftType==="template"){data.templates.push({...gymDraft,id:uid()});notify("Шаблон сохранён.");}
      else {data.workouts.push({...gymDraft,id:uid()});notify("Тренировка сохранена.");}
      saveData();gymDraft=null;render();
    }
    function saveBodyEntry(){
      const weight=$("#body-weight").value,waist=$("#body-waist").value,chest=$("#body-chest").value,arm=$("#body-arm").value;
      if([weight,waist,chest,arm].every(v=>v==="")){notify("Заполни хотя бы один параметр.");return;}
      const obj={id:editingBodyId||uid(),date:$("#body-date").value||today(),weight:weight===""?"":safeNum(weight),waist:waist===""?"":safeNum(waist),chest:chest===""?"":safeNum(chest),arm:arm===""?"":safeNum(arm),note:$("#body-note").value.trim()};
      if(editingBodyId)data.bodyEntries=data.bodyEntries.map(x=>x.id===editingBodyId?obj:x);else data.bodyEntries.push(obj);
      editingBodyId=null;saveData();render();notify("Измерение сохранено.");
    }
    function saveSleepEntry(){
      const hours=$("#sleep-hours").value;if(hours===""||safeNum(hours)<0||safeNum(hours)>24){notify("Укажи сон от 0 до 24 часов.");return;}
      const obj={id:editingSleepId||uid(),date:$("#sleep-date").value||today(),hours:safeNum(hours),feeling:safeNum($("#sleep-feeling").value),note:$("#sleep-note").value.trim()};
      if(editingSleepId)data.sleepEntries=data.sleepEntries.map(x=>x.id===editingSleepId?obj:x);else data.sleepEntries.push(obj);
      editingSleepId=null;saveData();render();notify("Запись сна сохранена.");
    }
    function saveApproach(){
      const obj={id:editingApproachId||uid(),date:$("#approach-date").value||today(),name:$("#approach-name").value.trim(),anxiety:safeNum($("#approach-anxiety").value),result:$("#approach-result").value,note:$("#approach-note").value.trim()};
      if(editingApproachId)data.approaches=data.approaches.map(a=>a.id===editingApproachId?obj:a);else data.approaches.push(obj);
      editingApproachId=null;saveData();render();notify("Подход сохранён.");
    }
    function saveOpener(){
      const title=$("#opener-title").value.trim(),textValue=$("#opener-text").value.trim(),category=$("#opener-category").value.trim();
      if(!textValue){notify("Введи текст фразы.");return;}
      const obj={id:editingOpenerId||uid(),title:title||"Моя фраза",text:textValue,category};
      if(editingOpenerId)data.openers=data.openers.map(o=>o.id===editingOpenerId?obj:o);else data.openers.unshift(obj);
      editingOpenerId=null;saveData();render();notify("Фраза сохранена.");
    }
    function exportBackup(){
      const payload={app:"PRIME ERA",version:2,exportedAt:new Date().toISOString(),data};
      const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
      const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=`prime-era-backup-${today()}.json`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);notify("Резервная копия подготовлена.");
    }
    function importBackup(file){
      const reader=new FileReader();
      reader.onload=()=>{try{const parsed=JSON.parse(reader.result);const imported=parsed.data||parsed;if(!imported||!Array.isArray(imported.workouts)||!Array.isArray(imported.approaches)||!Array.isArray(imported.bodyEntries)||!Array.isArray(imported.sleepEntries)||!Array.isArray(imported.openers))throw new Error("invalid");if(!confirm("Импорт заменит текущие данные. Продолжить?"))return;data={...defaults(),...imported,settings:{...defaults().settings,...(imported.settings||{})},templates:Array.isArray(imported.templates)?imported.templates:[]};saveData();mode="chooser";render();notify("Резервная копия восстановлена.");}catch(e){notify("Не удалось прочитать копию. Проверь, что это файл PRIME ERA JSON.");}};
      reader.readAsText(file);
    }
    function fallbackCopy(textValue){
      const ta=document.createElement("textarea");ta.value=textValue;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");notify("Фраза скопирована.");}catch(e){notify("Не удалось скопировать. Выдели текст вручную.");}ta.remove();
    }
    $("#app").addEventListener("change",e=>{if(e.target.id==="backup-file"&&e.target.files?.[0])importBackup(e.target.files[0]);});
    render();
    if("serviceWorker" in navigator && location.protocol.startsWith("http")) window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
  })();
  </script>
</body>
</html>
